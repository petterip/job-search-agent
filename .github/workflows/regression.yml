name: API regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly sanity check — APIs and counts drift over time
    - cron: "0 6 * * 1"

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run regression gate
        run: make test-regression
